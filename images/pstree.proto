syntax = "proto2";

message pstree_entry {
	required uint32			pid		= 1;
	required uint32			ppid		= 2;
	required uint32			pgid		= 3;
	required uint32			sid		= 4;
	repeated uint32			threads		= 5;
	/* The pid of the task in its own (the innermost) pid namespace,
	 * when it differs from the one of the root task of the dump. */
	optional uint32			own_pid		= 6;
}
