syntax = "proto2";

message uid_gid_extent {
	required uint32 first		= 1;
	required uint32 lower_first	= 2;
	required uint32 count		= 3;
}

message userns_entry {
	repeated uid_gid_extent uid_map	= 1;
	repeated uid_gid_extent gid_map = 2;

	// CAST AI fields
	/* The pid (in the root task's pid namespace) of the task which has
	 * created a nested user namespace: the one which re-creates it on
	 * restore. The high number keeps the field from colliding with the
	 * ones the upstream criu keeps adding to this message. */
	optional uint32		creator_pid	= 1000;
}
